# tokyonight day accents on the gruvbox light neutrals (same cream bg, fg and grays as gruvbox_material_light_kitty.conf)
# accents darkened to >= 4.5:1 on the cream bg
# bright colors (8-15) are as dark as the normal ones: on a light bg the light variants are unreadable
# https://github.com/folke/tokyonight.nvim

foreground            #3c3836
background            #f2e5bc
cursor                #3c3836
cursor_text_color     #f9f5d7
selection_foreground  #3c3836
selection_background  #d5c4a1
url_color             #1561ca

##Tab
active_tab_foreground   #812eee
active_tab_background   #f9f5d7
active_tab_font_style   bold
inactive_tab_foreground #7c6f64
inactive_tab_background #f9f5d7
inactive_tab_font_style bold
tab_bar_background      #f2e5bc

# black
color0 #7c6f64
color8 #665c54

# red
color1 #c90941
color9 #c90941

# green
color2  #526c35
color10 #526c35

# yellow
color3  #7c6037
color11 #7c6037

# blue
color4  #1561ca
color12 #1561ca

# magenta
color5  #812eee
color13 #812eee

# cyan
color6  #006d92
color14 #006d92

# white (dark on light, so "white" text stays readable)
color7  #504945
color15 #3c3836

# light is for bright places: flat opaque background, no blur or dark tint
background_opacity 1.0
background_blur 0
background_image none

# DIM/FAINT text (Claude Code "Worked for", hints): kitty default 0.4 blends it into a light bg until unreadable
dim_opacity 0.85

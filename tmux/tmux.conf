set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

set -sg escape-time 0
set -g prefix C-a
set -s set-clipboard off
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0          # zero-out escape time delay
set -g history-limit 1000  # significantly increase history size
set -g renumber-windows on    # renumber all windows when any window is closed
set -g set-clipboard on       # use system clipboard
set -g status-interval 15     # gitmux cuesta 150-350ms por refresh; 15s lo hace despreciable
set -g status-left-length 10 # increase status line length
set -g status-position bottom    # macOS / darwin style

# colors — theme symlink managed by `theme` (~/.config/theme/theme.sh)
source-file -q ~/.config/tmux/current-theme.conf
set -g window-active-style          'fg=terminal,bg=terminal'
set -g status-style                 'bg=default' # transparent
set -g automatic-rename on
# automatic-rename-format is set by tmux-nerd-font-window-name plugin
# folder suffix only for auto-named windows; claude ones (claude-window-name.sh) show just their name
# attention mark for claude sessions (see claude-window-state.sh):
# red = waiting for you to approve something, green = working, yellow = your turn.
# yellow is also the default for a claude window with no state yet: a session that is
# working reports it on every tool, so silence almost always means it is waiting for you
set -g @claude-mark '#{?#{==:#{@claude-alert},wait},#[fg=red]● ,#{?#{==:#{@claude-alert},busy},#[fg=green]● ,#{?#{||:#{==:#{@claude-alert},idle},#{!=:#{@claude-name},}},#[fg=yellow]● ,}}}'
# tabs como píldoras: bordes redondeados (powerline) con fondo @tab-bg, la actual rellena de
# @accent. Los colores @tab-* vienen del tema. En la actual el punto va oscuro: sobre el acento
# los colores de estado no se leen, y en esa ventana ya estás mirando a Claude
set -g @pill-l "\ue0b6"
set -g @pill-r "\ue0b4"
set -g window-status-current-format '#[fg=#{@accent},bg=default]#{@pill-l}#[fg=#{@tab-dark},bg=#{@accent},bold]#{?#{E:@is-claude},● ,}#{E:@row-idx} #W#{?automatic-rename, #{b:pane_current_path},}#[fg=#{@accent},bg=default,nobold]#{@pill-r}'
set -g window-status-format         '#[fg=#{@tab-bg},bg=default]#{@pill-l}#[fg=#{@tab-fg},bg=#{@tab-bg}]#{E:@claude-mark}#[fg=#{@tab-fg}]#{E:@row-idx} #W#{?automatic-rename, #{b:pane_current_path},}#[fg=#{@tab-bg},bg=default]#{@pill-r}'

set -g status-left  ''    # la fila de arriba parte desde el borde; la de Claude lleva su ícono
set -g status-right '#(gitmux -cfg $HOME/.config/tmux/gitmux.conf "#{pane_current_path}")'

# barra de 2 líneas: arriba repos/servers, abajo las sesiones de Claude.
# son el status-format default con el loop de ventanas (#{W:}) filtrado por @is-claude.
# una ventana es de claude si el watcher le puso estado o el namer le puso nombre
set -g @is-claude '#{||:#{@claude-alert},#{@claude-name}}'
# numeración por fila: cada fila cuenta desde 1. La posición de una ventana es cuántas de su
# fila tienen índice <= al suyo. Un #{W:} anidado no ve la ventana de afuera, así que su fila
# e índice se le inyectan con s/ROW/ y s/IDX/ antes de expandir
set -g @row-idx-tpl '#{n:#{W:#{?#{&&:#{==:#{E:@is-claude},ROW},#{e|<=:#{window_index},IDX}},1,}}}'
set -g @row-idx     '#{E:#{s/ROW/#{E:@is-claude}/:#{s/IDX/#{window_index}/:@row-idx-tpl}}}'
# la ventana NUM de la fila en la que estás (#{W:,x} expande x solo en la ventana actual)
set -g @row-goto    '#{W:#{?#{&&:#{==:#{E:@is-claude},#{W:,#{E:@is-claude}}},#{==:#{E:@row-idx},NUM}},#{window_index},}}'
# siguiente/anterior dentro de la fila actual, dando la vuelta en los extremos (prefix + n/p)
set -g @row-size    '#{n:#{W:#{?#{==:#{E:@is-claude},#{W:,#{E:@is-claude}}},1,}}}'
set -g @row-next    '#{e|+:#{e|m:#{E:@row-idx},#{E:@row-size}},1}'
set -g @row-prev    '#{e|+:#{e|m:#{e|+:#{E:@row-idx},#{e|-:#{E:@row-size},2}},#{E:@row-size}},1}'
set -g status 2
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{E:@is-claude},,#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}}},#{?#{E:@is-claude},,#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-format[1] '#[align=left]#[fg=#{@accent2},bold] 󰚩 #[fg=white,nobold] #[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{E:@is-claude},#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},},#{?#{E:@is-claude},#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}},}}#[nolist]'

set -g default-terminal 'screen-256color'
set -sa terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on       # allow kitty desktop notifications (OSC 99)

unbind C-b
bind C-a send-prefix

unbind %
bind \\ split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind t
bind t new-window -c '#{pane_current_path}'

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
bind = select-layout -E       # equalize panes in current layout
unbind x
bind-key BSpace kill-pane # skip "kill-pane 1? (y/n)" prompt (cmd+w)

unbind ,
unbind .
bind -r , swap-window -t -1\; select-window -t -1  # move window left
bind -r . swap-window -t +1\; select-window -t +1  # move window right

# prefix + N va a la ventana N de la fila actual, no a la de índice N, y n/p ciclan dentro
# de esa fila (ver @row-goto)
bind 1 run -C 'select-window -t ":#{E:#{s/NUM/1/:@row-goto}}"'
bind 2 run -C 'select-window -t ":#{E:#{s/NUM/2/:@row-goto}}"'
bind 3 run -C 'select-window -t ":#{E:#{s/NUM/3/:@row-goto}}"'
bind 4 run -C 'select-window -t ":#{E:#{s/NUM/4/:@row-goto}}"'
bind 5 run -C 'select-window -t ":#{E:#{s/NUM/5/:@row-goto}}"'
bind 6 run -C 'select-window -t ":#{E:#{s/NUM/6/:@row-goto}}"'
bind 7 run -C 'select-window -t ":#{E:#{s/NUM/7/:@row-goto}}"'
bind 8 run -C 'select-window -t ":#{E:#{s/NUM/8/:@row-goto}}"'
bind 9 run -C 'select-window -t ":#{E:#{s/NUM/9/:@row-goto}}"'
bind n run -C 'select-window -t ":#{E:#{s/NUM/#{E:@row-next}/:@row-goto}}"'
bind p run -C 'select-window -t ":#{E:#{s/NUM/#{E:@row-prev}/:@row-goto}}"'

# buscador de panes (prefix + f): todos los panes de todas las ventanas, ver pane-finder.sh
bind f display-popup -E -B -w 60% -h 50% "$HOME/.config/tmux/pane-finder.sh"


# Use vim keybindings in copy mode
setw    -g  mode-keys    vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection 'pbcopy'
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse
bind-key -T copy-mode-vi 'i' send-keys -X cancel
set -g mouse on


# name windows after the Claude Code session running in them (see claude-window-name.sh).
# it is self-triggered: it sits in status-right printing nothing every status-interval, plus
# these hooks so a /rename shows up as soon as you touch tmux.
# (pane-focus-in is useless here: it needs focus-events on, which is off)
set-hook -g  after-select-window 'run -b "$HOME/.config/tmux/claude-window-name.sh"'
set-hook -g  client-attached     'run -b "$HOME/.config/tmux/claude-window-name.sh"'
set-hook -g  window-pane-changed 'run -b "$HOME/.config/tmux/claude-window-name.sh"'
set-hook -ga client-attached     'run -b "nohup $HOME/.config/tmux/claude-window-state.sh watch >/dev/null 2>&1 &"'

# watcher propio cada 2s: nombra las ventanas y deduce el estado de las sesiones sin
# hooks. No va por status-interval porque ese lo comparte con gitmux (150-350ms por
# refresh), así que el status bar quedó solo para gitmux.
# se lanza con nohup para que no sea un job de tmux: así no muere con el cliente que lo
# arrancó ni deja el mensaje "terminated by signal 15" cuando lo matan
run -b 'nohup $HOME/.config/tmux/claude-window-state.sh watch >/dev/null 2>&1 &'


#tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
# set -g @plugin 'janoamaral/tokyo-night-tmux'

# restore nvim panes
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'
set -g @continuum-restore 'on' # Restore last session on startup

# Initialize tpm plugin manager (must keep at the bottom of tmux.conf)
run -b '~/.config/tmux/plugins/tpm/tpm'

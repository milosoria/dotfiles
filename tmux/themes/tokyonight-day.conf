# tokyonight day — accents referenced as #{@accent}/#{@accent2} from tmux.conf formats
set -g @accent  '#9854f1'
set -g @accent2 '#2e7de9'
set -g pane-active-border-style 'fg=#9854f1,bg=default'
set -g pane-border-style        'fg=#a8aecb,bg=#d0d5e3'
set -g window-style             'fg=#8990b3,bg=#d0d5e3'
set -g @tab-bg   '#c4c8da'
set -g @tab-fg   '#6172b0'
set -g @tab-dark '#e1e2e7'

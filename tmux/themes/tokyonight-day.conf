# tokyonight day (gruvbox light neutrals, tokyo accents) — accents referenced as #{@accent}/#{@accent2} from tmux.conf formats
set -g @accent  '#812eee'
set -g @accent2 '#1561ca'
set -g pane-active-border-style 'fg=#812eee,bg=default'
set -g pane-border-style        'fg=#bdae93,bg=#ebdbb2'
set -g window-style             'fg=#7c6f64,bg=#ebdbb2'
set -g window-active-style      'fg=terminal,bg=#f2e5bc'
set -g @tab-bg   '#ebdbb2'
set -g @tab-fg   '#504945'
set -g @tab-dark '#f9f5d7'

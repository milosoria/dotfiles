# gruvbox material light (hard) — accents referenced as #{@accent}/#{@accent2} from tmux.conf formats
set -g @accent  '#af3a03'
set -g @accent2 '#076678'
set -g pane-active-border-style 'fg=#af3a03,bg=default'
set -g pane-border-style        'fg=#bdae93,bg=#ebdbb2'
set -g window-style             'fg=#7c6f64,bg=#ebdbb2'
set -g window-active-style      'fg=terminal,bg=#f2e5bc'
set -g @tab-bg   '#ebdbb2'
set -g @tab-fg   '#504945'
set -g @tab-dark '#f9f5d7'
